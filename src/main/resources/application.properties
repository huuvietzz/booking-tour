# ---------- AI chatbot (Spring AI ? Groq) ----------
# KHÔNG có "/v1" ? cu?i: Spring AI t? thêm "/v1/chat/completions"
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=1024
# gpt-oss là model "suy lu?n": low = ngh? ít ? tr? l?i nhanh, t?n ít token
spring.ai.openai.chat.options.reasoning-effort=low

# Starter OpenAI còn t? b?t embedding / ?nh / gi?ng nói / ki?m duy?t (Groq không có) ? t?t h?t, ch? dùng chat
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# Spring AI m?c ??nh th? l?i t?i 10 l?n khi AI l?i 5xx ? khách ch? r?t lâu. Chatbot ch? th? l?i 1 l?n.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s

# AI treo quá 30 giây thì b? (Spring Boot 3.4+ áp cho m?i RestClient t? c?u hình)
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=30s

# M?i IP t?i ?a 10 câu / phút
chatbot.rate-limit-per-minute=10
