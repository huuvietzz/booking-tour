# ---------- AI chatbot (Spring AI ? Groq) ----------
# KH\u00D4NG c\u00F3 "/v1" \u1EDF cu\u1ED1i: Spring AI t\u1EF1 th\u00EAm "/v1/chat/completions"
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=1024
# gpt-oss l\u00E0 model "suy lu\u1EADn": low = ngh\u0129 \u00EDt ? tr\u1EA3 l\u1EDDi nhanh, t\u1ED1n \u00EDt token
spring.ai.openai.chat.options.reasoning-effort=low

# Starter OpenAI c\u00F2n t\u1EF1 bi\u1EBFt embedding / \u1EA3nh / gi\u1ECDng n\u00F3i / ki\u1EC3m duy\u1EC7t (Groq kh\u00F4ng c\u00F3) ? t\u1EAFt h\u1EBFt, ch\u1EC9 d\u00F2ng chat
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# Spring AI m\u1EB7c \u0111\u1ECBnh th? l?i t?i 10 l?n khi AI l?i 5xx ? kh\uFFFDch ch? r?t l\uFFFDu. Chatbot ch? th? l?i 1 l?n.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s

# AI treo qu\uFFFD 30 gi\uFFFDy th\uFFFD b? (Spring Boot 3.4+ \uFFFDp cho m?i RestClient t? c?u h\uFFFDnh)
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=30s

# M\u1ED7i IP 10 c\u00E2u / ph\u00FAt
chatbot.rate-limit-per-minute=10

