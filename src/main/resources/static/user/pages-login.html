<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Đăng nhập - Booking Tour</title>

    <link href="assets/img/favicon.png" rel="icon">
    <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

    <link href="assets/css/style.css" rel="stylesheet">

    <style>
        body {
            background-color: #f6f7f9;
        }

        .login-wrapper {
            max-width: 500px;
            margin: 0 auto;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, .06);
            padding: 2.5rem 3rem 2rem;
        }

        .form-control-rounded {
            background-color: #f1f3f5;
            border: 1px solid transparent;
            border-radius: 999px;
            padding: .75rem 1.25rem;
            font-size: .95rem;
        }

        .form-control-rounded:focus {
            background-color: #fff;
            border-color: #4154f1;
            box-shadow: 0 0 0 .2rem rgba(65, 84, 241, .12);
        }

        .form-control-rounded.is-invalid {
            background-color: #fff;
            border-color: #dc3545;
        }

        .form-label {
            font-weight: 600;
            font-size: .95rem;
            margin-bottom: .5rem;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap .form-control-rounded {
            padding-right: 3rem;
            width: 100%;
        }

        .password-wrap .toggle-eye {
            position: absolute;
            top: 1.35rem;
            right: 1rem;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #6c757d;
            padding: 0;
            line-height: 1;
            z-index: 5;
        }

        .btn-pill {
            border-radius: 999px;
            padding: .8rem 1rem;
            font-weight: 600;
        }

        .invalid-feedback {
            padding-left: 1.25rem;
        }

        .modal-content-rounded {
            border-radius: 16px;
            border: none;
        }

        .modal-header-custom {
            border-bottom: none;
            padding: 1.5rem 1.5rem 0.5rem;
            position: relative;
        }

        .modal-header-custom .btn-close {
            position: absolute;
            right: 1.5rem;
            top: 1.5rem;
        }

        .modal-error-icon {
            width: 70px;
            height: 70px;
            background-color: #f99b24;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem auto;
        }

        .modal-error-icon i {
            font-size: 2.5rem;
            color: white;
            line-height: 1;
        }

        .btn-orange {
            background-color: #f99b24;
            color: white;
            border-radius: 999px;
            padding: .6rem 2.5rem;
            font-weight: 500;
            border: none;
        }

        .btn-orange:hover {
            background-color: #e08b1f;
            color: white;
        }

        /* Thông báo nhỏ trong modal quên mật khẩu */
        .forgot-msg {
            font-size: .875rem;
        }

        @media (max-width: 575.98px) {
            .login-card {
                padding: 1.75rem 1.25rem 1.5rem;
            }
        }

        .btn-outline-primary:hover,
        .btn-outline-primary:focus,
        .btn-outline-primary:active {
            background-color: transparent !important;
            color: #0d6efd !important;
            border-color: #0d6efd !important;
        }
    </style>
</head>

<body>

<main class="py-5">
    <div class="container login-wrapper">

        <div class="text-center mb-4">
            <a href="index.html" class="logo d-inline-flex align-items-center text-decoration-none">
                <img src="assets/img/logo.png" alt="" height="48">
                <span class="ms-2 fs-3 fw-bold">Booking Tour</span>
            </a>
        </div>

        <div class="login-card">

            <h4 class="text-center fw-bold mb-4">Đăng nhập</h4>

            <!-- Báo "xác thực email thành công" khi từ verify-email.html chuyển về -->
            <div class="alert alert-success d-none" id="topAlert" role="alert"></div>

            <form class="row g-3" id="loginForm" novalidate>

                <div class="col-12">
                    <label for="username" class="form-label">
                        Số điện thoại hoặc email <span class="text-danger">(*)</span>
                    </label>
                    <input type="text" class="form-control form-control-rounded" id="username"
                           placeholder="Nhập số điện thoại hoặc email" required>
                    <div class="invalid-feedback" id="usernameFeedback">
                        Vui lòng nhập số điện thoại hoặc email
                    </div>
                </div>

                <div class="col-12">
                    <label for="password" class="form-label">
                        Mật khẩu <span class="text-danger">(*)</span>
                    </label>
                    <div class="password-wrap">
                        <input type="password" class="form-control form-control-rounded" id="password"
                               placeholder="Nhập mật khẩu" required>
                        <button class="toggle-eye" type="button"
                                data-toggle-password="password" tabindex="-1">
                            <i class="bi bi-eye"></i>
                        </button>
                        <div class="invalid-feedback" id="passwordFeedback">
                            Vui lòng nhập mật khẩu
                        </div>
                    </div>
                </div>

                <div class="col-12 text-end mt-2">
                    <a href="#" class="text-decoration-none small" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Quên mật khẩu?</a>
                </div>

                <div class="col-12 mt-4">
                    <button class="btn btn-primary btn-pill w-100 mb-3" type="submit" id="submitBtn">
                        <span class="spinner-border spinner-border-sm d-none" id="submitSpinner"></span>
                        <span id="submitText">Đăng nhập</span>
                    </button>

                    <a href="pages-register.html" class="btn btn-outline-primary btn-pill w-100">
                        Đăng ký ngay
                    </a>
                </div>

            </form>

        </div>
    </div>

    <!-- Modal thông báo lỗi -->
    <div class="modal fade" id="errorModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content modal-content-rounded py-4 px-3">
                <div class="modal-body text-center p-0">
                    <div class="modal-error-icon">
                        <i class="bi bi-exclamation"></i>
                    </div>
                    <h5 class="fw-bold mb-2 text-dark">Thông báo</h5>
                    <p class="text-secondary mb-4" id="errorMessage">Tài khoản hoặc mật khẩu không đúng</p>
                    <button type="button" class="btn btn-orange" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal quên mật khẩu -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-rounded">
                <div class="modal-header modal-header-custom">
                    <h5 class="modal-title w-100 text-center fw-bold" id="forgotPasswordModalLabel">Quên mật khẩu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body px-4 pb-4 pt-2">
                    <p class="text-center text-muted small mb-4">Vui lòng nhập email</p>

                    <form id="forgotForm" novalidate>
                        <div class="mb-3">
                            <label for="forgotEmail" class="form-label">
                                Email <span class="text-danger">(*)</span>
                            </label>
                            <input type="email" class="form-control form-control-rounded" id="forgotEmail" placeholder="Nhập email của bạn" required>
                            <div class="invalid-feedback" id="forgotEmailFeedback">
                                Vui lòng nhập email
                            </div>
                        </div>

                        <!-- Thông báo trả về từ API -->
                        <div id="forgotResultMsg" class="forgot-msg mb-3 d-none"></div>

                        <button class="btn btn-light btn-pill w-100" style="background-color: #e9ecef; border: none; color: #495057;" type="submit" id="forgotSubmitBtn" disabled>
                            <span class="spinner-border spinner-border-sm d-none" id="forgotSubmitSpinner"></span>
                            <span id="forgotSubmitText">Lấy lại mật khẩu</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</main>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<script>
    // =====================================================================
    // FORM ĐĂNG NHẬP
    // =====================================================================
    const form          = document.getElementById('loginForm');
    const submitBtn     = document.getElementById('submitBtn');
    const submitText    = document.getElementById('submitText');
    const spinner       = document.getElementById('submitSpinner');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const topAlert      = document.getElementById('topAlert');

    const errorModalInstance = new bootstrap.Modal(document.getElementById('errorModal'));
    const errorMessageEl     = document.getElementById('errorMessage');

    // Vừa xác thực email xong thì verify-email.html chuyển về đây kèm ?verified=true
    const params = new URLSearchParams(window.location.search);
    if (params.get('verified') === 'true') {
        topAlert.textContent = 'Xác thực email thành công. Bạn có thể đăng nhập ngay bây giờ.';
        topAlert.classList.remove('d-none');
    }

    document.querySelectorAll('[data-toggle-password]').forEach(btn => {
        btn.addEventListener('click', () => {
            const input = document.getElementById(btn.dataset.togglePassword);
            const icon  = btn.querySelector('i');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.className = isHidden ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
    });

    usernameInput.addEventListener('input', function() { this.classList.remove('is-invalid'); });
    passwordInput.addEventListener('input', function() { this.classList.remove('is-invalid'); });

    function showErrorPopup(msg) {
        errorMessageEl.textContent = msg;
        errorModalInstance.show();
    }

    function setLoading(loading) {
        submitBtn.disabled = loading;
        spinner.classList.toggle('d-none', !loading);
        submitText.textContent = loading ? 'Đang xử lý...' : 'Đăng nhập';
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        event.stopPropagation();

        usernameInput.classList.remove('is-invalid');
        passwordInput.classList.remove('is-invalid');
        topAlert.classList.add('d-none');

        let isValid = true;
        const usernameVal = usernameInput.value.trim();
        const passwordVal = passwordInput.value;

        if (!usernameVal) {
            document.getElementById('usernameFeedback').textContent = 'Vui lòng nhập số điện thoại hoặc email';
            usernameInput.classList.add('is-invalid');
            isValid = false;
        }
        if (!passwordVal) {
            document.getElementById('passwordFeedback').textContent = 'Vui lòng nhập mật khẩu';
            passwordInput.classList.add('is-invalid');
            isValid = false;
        }
        if (!isValid) return;

        // Tên field PHẢI khớp LoginRequest.java: emailOrPhone
        const payload = {
            emailOrPhone: usernameVal,
            password: passwordVal
        };

        setLoading(true);

        try {
            const res  = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const json = await res.json();

            if (json.success) {
                // AuthResponse nằm trong json.data
                localStorage.setItem('token',    json.data.token);
                localStorage.setItem('userId',   json.data.userId);
                localStorage.setItem('fullName', json.data.fullName);
                localStorage.setItem('email',    json.data.email);
                localStorage.setItem('role',     json.data.role);

                // Chưa có ảnh thì XOÁ key, không để sót ảnh của tài khoản đăng nhập trước
                if (json.data.avatarUrl) {
                    localStorage.setItem('avatarUrl', json.data.avatarUrl);
                } else {
                    localStorage.removeItem('avatarUrl');
                }

                window.location.href = 'index.html';
                return;
            }

            // 403 = tài khoản chưa xác thực email (ErrorCode.EMAIL_NOT_VERIFIED)
            // 401 = sai thông tin đăng nhập (ErrorCode.INVALID_CREDENTIALS)
            showErrorPopup(json.message || 'Tài khoản hoặc mật khẩu không đúng');

        } catch (err) {
            showErrorPopup('Không kết nối được tới máy chủ. Vui lòng thử lại.');
        } finally {
            setLoading(false);
        }
    });


    // =====================================================================
    // MODAL QUÊN MẬT KHẨU
    // =====================================================================
    const forgotForm       = document.getElementById('forgotForm');
    const forgotSubmitBtn  = document.getElementById('forgotSubmitBtn');
    const forgotSubmitText = document.getElementById('forgotSubmitText');
    const forgotSpinner    = document.getElementById('forgotSubmitSpinner');
    const forgotEmailInput = document.getElementById('forgotEmail');
    const forgotResultMsg  = document.getElementById('forgotResultMsg');
    const forgotFeedback   = document.getElementById('forgotEmailFeedback');

    const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function setForgotLoading(loading) {
        forgotSubmitBtn.disabled = loading || forgotEmailInput.value.trim() === '';
        forgotSpinner.classList.toggle('d-none', !loading);
        forgotSubmitText.textContent = loading ? 'Đang xử lý...' : 'Lấy lại mật khẩu';
    }

    function enableForgotBtn(enable) {
        forgotSubmitBtn.disabled = !enable;
        forgotSubmitBtn.classList.toggle('btn-primary', enable);
        forgotSubmitBtn.classList.toggle('btn-light', !enable);
        forgotSubmitBtn.style.backgroundColor = enable ? '' : '#e9ecef';
        forgotSubmitBtn.style.color = enable ? '#fff' : '#495057';
    }

    forgotEmailInput.addEventListener('input', function() {
        this.classList.remove('is-invalid');
        forgotResultMsg.classList.add('d-none');
        enableForgotBtn(this.value.trim() !== '');
    });

    document.getElementById('forgotPasswordModal')
        .addEventListener('hidden.bs.modal', function () {
            forgotForm.reset();
            forgotEmailInput.classList.remove('is-invalid');
            forgotResultMsg.classList.add('d-none');
            enableForgotBtn(false);
        });

    forgotForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        event.stopPropagation();

        forgotEmailInput.classList.remove('is-invalid');
        forgotResultMsg.classList.add('d-none');

        const val = forgotEmailInput.value.trim();

        if (!val) {
            forgotFeedback.textContent = 'Vui lòng nhập email';
            forgotEmailInput.classList.add('is-invalid');
            return;
        }
        if (!EMAIL_REGEX.test(val)) {
            forgotFeedback.textContent = 'Email không hợp lệ';
            forgotEmailInput.classList.add('is-invalid');
            return;
        }

        setForgotLoading(true);

        try {
            const res  = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: val })
            });
            const json = await res.json();

            // Backend cố tình trả cùng một message dù email có tồn tại hay không,
            // để người ngoài không dò được tài khoản nào đã đăng ký.
            forgotResultMsg.className = 'forgot-msg mb-3 ' +
                (json.success ? 'text-success' : 'text-danger');
            forgotResultMsg.textContent = json.message;
            forgotResultMsg.classList.remove('d-none');

            if (json.success) {
                forgotEmailInput.disabled = true;
                enableForgotBtn(false);
            }
        } catch (err) {
            forgotResultMsg.className = 'forgot-msg mb-3 text-danger';
            forgotResultMsg.textContent = 'Không kết nối được tới máy chủ.';
            forgotResultMsg.classList.remove('d-none');
        } finally {
            setForgotLoading(false);
        }
    });
</script>

</body>
</html>
