<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Đặt lại mật khẩu - Booking Tour</title>

    <link href="assets/img/favicon.png" rel="icon">
    <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

    <link href="assets/css/style.css" rel="stylesheet">

    <style>
        body {
            background-color: #f6f7f9;
        }

        .reset-wrapper {
            max-width: 500px;
            margin: 0 auto;
        }

        .reset-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, .06);
            padding: 2.5rem 3rem 2rem;
        }

        .form-control-rounded {
            background-color: #f1f3f5;
            border: 1px solid transparent;
            border-radius: 999px;
            padding: .75rem 1.25rem;
            font-size: .95rem;
        }

        .form-control-rounded:focus {
            background-color: #fff;
            border-color: #4154f1;
            box-shadow: 0 0 0 .2rem rgba(65, 84, 241, .12);
        }

        .form-control-rounded.is-invalid {
            background-color: #fff;
            border-color: #dc3545;
        }

        .form-label {
            font-weight: 600;
            font-size: .95rem;
            margin-bottom: .5rem;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap .form-control-rounded {
            padding-right: 3rem;
            width: 100%;
        }

        .password-wrap .toggle-eye {
            position: absolute;
            top: 1.35rem;
            right: 1rem;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #6c757d;
            padding: 0;
            line-height: 1;
            z-index: 5;
        }

        .btn-pill {
            border-radius: 999px;
            padding: .8rem 1rem;
            font-weight: 600;
        }

        .invalid-feedback {
            padding-left: 1.25rem;
        }

        .status-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
        }

        .status-icon i {
            font-size: 2.5rem;
            color: #fff;
            line-height: 1;
        }

        .icon-success { background-color: #2eca6a; }
        .icon-error   { background-color: #f99b24; }

        @media (max-width: 575.98px) {
            .reset-card { padding: 1.75rem 1.25rem 1.5rem; }
        }
    </style>
</head>

<body>

<main class="py-5">
    <div class="container reset-wrapper">

        <div class="text-center mb-4">
            <a href="index.html" class="logo d-inline-flex align-items-center text-decoration-none">
                <img src="assets/img/logo.png" alt="" height="48">
                <span class="ms-2 fs-3 fw-bold">Booking Tour</span>
            </a>
        </div>

        <div class="reset-card">

            <!-- Form đổi mật khẩu -->
            <div id="formState">
                <h4 class="text-center fw-bold mb-4">Đặt lại mật khẩu</h4>

                <form class="row g-3" id="resetForm" novalidate>

                    <div class="col-12">
                        <label for="newPassword" class="form-label">
                            Mật khẩu mới <span class="text-danger">(*)</span>
                        </label>
                        <div class="password-wrap">
                            <input type="password" class="form-control form-control-rounded" id="newPassword"
                                   placeholder="Nhập mật khẩu mới" required>
                            <button class="toggle-eye" type="button"
                                    data-toggle-password="newPassword" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                            <div class="invalid-feedback" id="newPasswordFeedback">
                                Mật khẩu phải có ít nhất 6 ký tự
                            </div>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="confirmPassword" class="form-label">
                            Nhập lại mật khẩu mới <span class="text-danger">(*)</span>
                        </label>
                        <div class="password-wrap">
                            <input type="password" class="form-control form-control-rounded" id="confirmPassword"
                                   placeholder="Nhập lại mật khẩu mới" required>
                            <button class="toggle-eye" type="button"
                                    data-toggle-password="confirmPassword" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                            <div class="invalid-feedback" id="confirmPasswordFeedback">
                                Mật khẩu nhập lại không khớp
                            </div>
                        </div>
                    </div>

                    <div class="col-12 d-none" id="errorBox">
                        <div class="text-danger small" id="errorText"></div>
                    </div>

                    <div class="col-12 mt-4">
                        <button class="btn btn-primary btn-pill w-100" type="submit" id="submitBtn" disabled>
                            <span class="spinner-border spinner-border-sm d-none" id="submitSpinner"></span>
                            <span id="submitText">Đặt lại mật khẩu</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Đổi thành công -->
            <div id="successState" class="d-none text-center">
                <div class="status-icon icon-success">
                    <i class="bi bi-check-lg"></i>
                </div>
                <h5 class="fw-bold mb-3">Đổi mật khẩu thành công</h5>
                <p class="text-secondary mb-4" id="successMessage"></p>
                <a href="pages-login.html" class="btn btn-primary btn-pill w-100">
                    Đăng nhập ngay
                </a>
            </div>

            <!-- Link hỏng / hết hạn -->
            <div id="invalidState" class="d-none text-center">
                <div class="status-icon icon-error">
                    <i class="bi bi-exclamation"></i>
                </div>
                <h5 class="fw-bold mb-3">Link không hợp lệ</h5>
                <p class="text-secondary mb-4" id="invalidMessage"></p>
                <p class="text-muted small mb-4">
                    Link đặt lại mật khẩu chỉ dùng được một lần và có hiệu lực trong 15 phút.
                </p>
                <a href="pages-login.html" class="btn btn-primary btn-pill w-100">
                    Về trang đăng nhập
                </a>
            </div>

        </div>
    </div>
</main>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<script>
    // Token đọc từ link trong email, người dùng không nhập
    const token = new URLSearchParams(window.location.search).get('token');

    const formState    = document.getElementById('formState');
    const successState = document.getElementById('successState');
    const invalidState = document.getElementById('invalidState');

    const form        = document.getElementById('resetForm');
    const submitBtn   = document.getElementById('submitBtn');
    const submitText  = document.getElementById('submitText');
    const spinner     = document.getElementById('submitSpinner');
    const newPass     = document.getElementById('newPassword');
    const confirmPass = document.getElementById('confirmPassword');
    const errorBox    = document.getElementById('errorBox');
    const errorText   = document.getElementById('errorText');

    // Không có token thì không hiện form
    if (!token) {
        formState.classList.add('d-none');
        invalidState.classList.remove('d-none');
        document.getElementById('invalidMessage').textContent =
            'Link không hợp lệ: thiếu mã xác thực.';
    }

    document.querySelectorAll('[data-toggle-password]').forEach(btn => {
        btn.addEventListener('click', () => {
            const input = document.getElementById(btn.dataset.togglePassword);
            const icon  = btn.querySelector('i');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.className = isHidden ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
    });

    // Nút chỉ bật khi cả hai ô hợp lệ và khớp nhau
    function checkFormState() {
        const ok = newPass.value.length >= 6 && confirmPass.value === newPass.value;
        submitBtn.disabled = !ok;
    }

    newPass.addEventListener('input', function() {
        if (this.value.length >= 6) this.classList.remove('is-invalid');
        if (confirmPass.value !== '') {
            confirmPass.classList.toggle('is-invalid', confirmPass.value !== this.value);
        }
        checkFormState();
    });
    newPass.addEventListener('blur', function() {
        if (this.value.length < 6) this.classList.add('is-invalid');
    });

    confirmPass.addEventListener('input', function() {
        if (this.value === newPass.value) this.classList.remove('is-invalid');
        checkFormState();
    });
    confirmPass.addEventListener('blur', function() {
        if (this.value !== newPass.value) this.classList.add('is-invalid');
    });

    function setLoading(loading) {
        submitBtn.disabled = loading;
        spinner.classList.toggle('d-none', !loading);
        submitText.textContent = loading ? 'Đang xử lý...' : 'Đặt lại mật khẩu';
        if (!loading) checkFormState();
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        event.stopPropagation();
        errorBox.classList.add('d-none');

        setLoading(true);

        try {
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token:           token,
                    newPassword:     newPass.value,
                    confirmPassword: confirmPass.value
                })
            });
            const json = await res.json();

            if (json.success) {
                formState.classList.add('d-none');
                successState.classList.remove('d-none');
                document.getElementById('successMessage').textContent = json.message;
                return;
            }

            // Token hỏng / hết hạn / đã dùng -> không cho thử lại, chuyển sang màn báo lỗi
            if (json.code === 400) {
                formState.classList.add('d-none');
                invalidState.classList.remove('d-none');
                document.getElementById('invalidMessage').textContent = json.message;
                return;
            }

            // Lỗi validate mật khẩu -> giữ form, hiện lỗi dưới ô
            errorText.innerHTML = json.errors && json.errors.length
                ? json.errors.join('<br>')
                : json.message;
            errorBox.classList.remove('d-none');

        } catch (err) {
            errorText.textContent = 'Không kết nối được tới máy chủ. Vui lòng thử lại.';
            errorBox.classList.remove('d-none');
        } finally {
            setLoading(false);
        }
    });
</script>

</body>
</html>
